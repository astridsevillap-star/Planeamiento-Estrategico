.cols{height:22px;padding:0 5px;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;border-bottom:1px solid var(--line)}
.rows{height:calc(100% - 22px);display:flex;flex-direction:column;gap:0;padding:0}

.name{font-size:11px;font-weight:900;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function mapRow(r){let base=INITIAL_DATA.find(x=>x.orden===r.orden);let det=Array.isArray(r.detalle)&&r.detalle.length?r.detalle:(base?.acciones||[]);return {id:String(r.id),orden:r.orden,nombre:r.nombre,avance:r.avance,status:r.estado,periodo:r.periodo,acciones:det,nota:base?.nota||"Detalle consolidado desde el planeamiento original."}}
async function loadData(){loading=true;try{let rows=await api("?select=*&activo=eq.true&order=orden.asc",{method:"GET",headers:{"Prefer":""}});data=rows.map(mapRow)}catch(e){console.error(e);alert("No se pudo cargar la información compartida. Se mostrará la estructura base temporalmente.")}finally{loading=false;render()}}
async function patchProject(x){await api("?id=eq."+encodeURIComponent(x.id),{method:"PATCH",body:JSON.stringify({orden:x.orden,nombre:x.nombre,avance:+x.avance||0,estado:x.status,periodo:x.periodo,detalle:x.acciones||[],updated_at:new Date().toISOString()})})}
async function persistOrder(){for(const x of sorted())await patchProject(x)}
function render(){
 const v=visible(),y26=data.filter(x=>x.periodo==="2026"),y27=data.filter(x=>x.periodo==="2027");
 $("kTotal").textContent=y26.length;
 let avg=(y26.length?Math.round(y26.reduce((s,x)=>s+(+x.avance||0),0)/y26.length):0);
 $("kAvg").textContent=avg+"%"; $("avgRing").style.setProperty("--p",avg+"%"); $("heatDot").style.left=avg+"%";
 $("kDone").textContent=y26.filter(x=>+x.avance===100||x.status==="FINALIZADO").length;
 $("kProcess").textContent=y26.filter(x=>+x.avance>0&&+x.avance<100).length;
 $("kPending").textContent=y26.filter(x=>+x.avance===0&&x.status!=="FINALIZADO").length;
 $("kNext").textContent=y27.length;
 $("periodLabel").textContent=mode==="2026"?"2026":"2026 + 2027";
 $("rows").innerHTML=v.map((x,i)=>`<div class="row" data-id="${x.id}"><span class="num">${i+1}</span><span class="nameWrap"><span class="projIcon">${projIcon(x.nombre)}</span><span class="name" title="${esc(x.nombre)}">${esc(x.nombre)}</span></span><span class="progress"><span class="track"><span class="fill" style="width:${+x.avance||0}%;background:${pctCls(x)==="p-green"?"#177245":pctCls(x)==="p-amber"?"#D49A00":pctCls(x)==="p-red"?"#B42318":"#A8B2BC"}"></span></span><span class="pct ${pctCls(x)}">${+x.avance||0}%</span></span><span class="status ${cls(x.status)}">${esc(x.status)}</span><span class="handle" draggable="true" data-drag="${x.id}" title="Mover">✥</span></div>`).join("");
 document.querySelectorAll(".row").forEach(r=>r.addEventListener("click",e=>{if(!e.target.matches(".handle"))openMacro(r.dataset.id)}));
 wireDnD();
}
function wireDnD(){let src=null;document.querySelectorAll(".handle").forEach(h=>{h.ondragstart=e=>{src=h.dataset.drag;e.dataTransfer.effectAllowed="move"};h.ondragend=()=>src=null});document.querySelectorAll(".row").forEach(r=>{r.ondragover=e=>{e.preventDefault()};r.ondrop=async e=>{e.preventDefault();if(!src||src===r.dataset.id)return;let arr=sorted(),a=arr.findIndex(x=>x.id===src),b=arr.findIndex(x=>x.id===r.dataset.id),[m]=arr.splice(a,1);arr.splice(b,0,m);arr.forEach((x,i)=>x.orden=i+1);data=arr;render();try{await persistOrder()}catch(err){console.error(err);alert("No se pudo guardar el nuevo orden.");await loadData()}}})}
function openMacro(id){current=String(id);let x=data.find(z=>String(z.id)===current);if(!x)return;$("mtitle").textContent=x.nombre;$("msub").textContent=`${x.periodo} · ${x.avance}%`;$("ename").value=x.nombre;$("epct").value=x.avance;$("estatus").value=x.status;$("eperiod").value=x.periodo;$("note").textContent=x.nota||"Detalle consolidado desde el planeamiento original.";$("tbody").innerHTML=x.acciones.length?x.acciones.map((a,i)=>`<tr><td>${esc(a.accion)}</td><td class="origin">${esc(a.origen)}</td><td>${esc(a.responsable)}</td><td><select class="actSelect" data-i="${i}" data-field="estado">${["PENDIENTE","EN PROCESO","LANZADO","REALIZADO","BLOQUEADO"].map(v=>`<option ${a.estado===v?"selected":""}>${v}</option>`).join("")}</select></td><td><input class="actDate" type="date" data-i="${i}" data-field="fin" value="${esc(a.fin||"")}"></td><td><input class="actDate" type="date" data-i="${i}" data-field="ejecucion" value="${esc(a.ejecucion||"")}"></td></tr>`).join(""):`<tr><td colspan="6" class="empty">Sin actividades cargadas.</td></tr>`;document.querySelectorAll(".actSelect,.actDate").forEach(el=>el.addEventListener("change",saveActivity));$("modal").classList.add("open")}
async function saveActivity(e){let x=data.find(z=>String(z.id)===String(current));if(!x)return;let i=+e.target.dataset.i,field=e.target.dataset.field;x.acciones[i][field]=e.target.value;e.target.classList.add("saving");try{await patchProject(x)}catch(err){console.error(err);alert("No se pudo guardar la actividad.");await loadData()}finally{e.target.classList.remove("saving")}}
async function saveEdit(){let x=data.find(z=>String(z.id)===String(current));if(!x)return;x.nombre=$("ename").value.trim()||x.nombre;x.avance=Math.max(0,Math.min(100,+$("epct").value||0));x.status=$("estatus").value;x.periodo=$("eperiod").value;if(x.periodo==="2027"&&!x.status.includes("2027"))x.status="2027";render();try{await patchProject(x);openMacro(current)}catch(e){console.error(e);alert("No se pudo guardar el cambio.");await loadData()}}
["ename","epct","estatus","eperiod"].forEach(id=>$(id).addEventListener("change",saveEdit));
$("close").onclick=()=>$("modal").classList.remove("open");$("modal").addEventListener("click",e=>{if(e.target.id==="modal")$("modal").classList.remove("open")});
$("del").onclick=async()=>{let x=data.find(z=>String(z.id)===String(current));if(x&&confirm(`¿Eliminar "${x.nombre}"?`)){try{await api("?id=eq."+encodeURIComponent(x.id),{method:"DELETE"});data=data.filter(z=>String(z.id)!==String(current));data.sort((a,b)=>a.orden-b.orden).forEach((z,i)=>z.orden=i+1);await persistOrder();$("modal").classList.remove("open");render()}catch(e){console.error(e);alert("No se pudo eliminar el proyecto.")}}};
$("view2026").onclick=()=>{mode="2026";render()};$("viewAll").onclick=()=>{mode="ALL";render()};
$("add").onclick=async()=>{let n=prompt("Nombre del proyecto:");if(!n)return;try{let row=await api("",{method:"POST",body:JSON.stringify({orden:data.length+1,nombre:n,avance:0,estado:"PENDIENTE",periodo:"2026",detalle:[],activo:true})});if(row&&row[0])data.push(mapRow(row[0]));render()}catch(e){console.error(e);alert("No se pudo agregar el proyecto.")}};
$("reset").onclick=()=>{if(confirm("Esta opción ya no restablece datos compartidos. ¿Recargar la información guardada?"))loadData()};
$("csv").onclick=()=>{let rows=[["Orden","Proyecto","Avance","Status","Periodo"],...sorted().map(x=>[x.orden,x.nombre,x.avance+"%",x.status,x.periodo])],q=v=>'"'+String(v).replace(/"/g,'""')+'"',csv="\uFEFF"+rows.map(r=>r.map(q).join(";")).join("\r\n"),b=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Planeamiento_Estrategico.csv";a.click();URL.revokeObjectURL(a.href)};
$("save").onclick=()=>{let b=new Blob(["<!doctype html>\n"+document.documentElement.outerHTML],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Planeamiento_Estrategico_Gestion_de_Personas.html";a.click();URL.revokeObjectURL(a.href)};
render();
loadData();
</script></body></html>
